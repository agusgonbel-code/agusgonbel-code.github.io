<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mis Marcas"><title>Mis Marcas Gym</title><link rel="manifest" href="manifest.webmanifest"><style>body{font-family:system-ui;background:#101827;color:#f4f6fc;margin:0;padding:18px 15px 90px;max-width:700px;margin:auto}h1{font-size:25px}button,input,select{font:inherit;border-radius:10px;padding:10px;border:1px solid #4a5974}button{background:#334766;color:white;margin:3px}button.primary{background:#24a884;color:#061e17;font-weight:bold}input{background:#19263a;color:white;max-width:90px}input[type=text]{max-width:220px}.card{background:#1b2a40;padding:13px;border-radius:15px;margin:12px 0}.muted{color:#b6c2d5;font-size:13px}.tabs{display:flex;flex-wrap:wrap;gap:4px}.tabs button{flex:1;font-size:13px}.active{background:#24a884;color:#061e17} .set{display:flex;align-items:center;gap:6px;margin:8px 0;flex-wrap:wrap}.set input{width:65px}.line{border-top:1px solid #35455f;margin:12px 0}</style></head><body><h1>💪 Mis Marcas Gym</h1><div class="muted">Tus series, tus marcas y tu progreso · guardado en este iPhone</div><div class="tabs" id="tabs"></div><div id="main"></div><div class="card"><b>Copias JSON</b><p><button onclick="exportData()">Exportar JSON</button><label style="display:inline-block;background:#334766;padding:10px;border-radius:10px">Importar JSON <input type="file" accept=".json,application/json" onchange="importData(this)" style="width:95px"></label></p><div class="muted">Importa archivos exportados por Mis Marcas Gym. Otros formatos requieren conversión.</div></div><script>
const defaults=[["Pecho y tríceps",["Press banca","Press inclinado mancuernas","Aperturas en polea","Extensión tríceps en polea","Extensión tríceps sobre cabeza"]],["Espalda y bíceps",["Jalón al pecho","Remo con barra","Remo en polea baja","Curl bíceps con barra","Curl inclinado con mancuernas"]],["Pierna completa",["Sentadilla","Prensa","Peso muerto rumano","Curl femoral","Elevación de gemelos"]],["Hombros, tríceps y bíceps",["Press militar","Elevaciones laterales","Pájaros","Extensión tríceps en polea","Extensión tríceps sobre cabeza","Curl bíceps con barra","Curl martillo"]]];
const key="mis-marcas-gym-v3";let state;try{state=JSON.parse(localStorage.getItem(key))}catch(e){}if(!state||!Array.isArray(state.days)){state={days:defaults.map(([name,exercises])=>({name,exercises:exercises.map(name=>({id:crypto.randomUUID(),name,sets:[{kg:"",reps:""},{kg:"",reps:""},{kg:"",reps:""}]}))})),history:[]}}if(state.routineVersion!==2){state.days=defaults.map(([name,names],i)=>({name,exercises:names.map(n=>{let old=state.days[i]?.exercises?.find(e=>e.name===n);return old||{id:crypto.randomUUID(),name:n,sets:[{kg:"",reps:""},{kg:"",reps:""},{kg:"",reps:""}]}})}));state.routineVersion=2;}let day=(new Date().getDay()+6)%7;if(day>3)day=0;const save=()=>localStorage.setItem(key,JSON.stringify(state));const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const id=()=>crypto.randomUUID();function last(ex){for(let i=state.history.length-1;i>=0;i--){let a=state.history[i].exercises.find(x=>x.id===ex.id||x.name===ex.name);if(a)return state.history[i].date+": "+a.sets.map(s=>s.kg+" kg × "+s.reps).join(" · ")}return "Sin marcas anteriores"}function render(){document.getElementById("tabs").innerHTML=state.days.map((d,i)=>'<button class="'+(i===day?"active":"")+'" onclick="day='+i+';render()">'+["Lun","Mar","Mié","Jue"][i]+'<div>'+esc(d.name)+'</div></button>').join("");let d=state.days[day];document.getElementById("main").innerHTML='<h2>'+esc(d.name)+'</h2>'+d.exercises.map((ex,j)=>'<div class="card"><div><b>'+esc(ex.name)+'</b> <button onclick="rename('+j+')">✎</button> <button onclick="removeEx('+j+')">×</button></div><div class="muted">Última vez: '+esc(last(ex))+'</div><div class="line"></div>'+ex.sets.map((s,k)=>'<div class="set"><span>Serie '+(k+1)+'</span><input type="number" min="0" step="0.5" placeholder="kg" value="'+esc(s.kg)+'" oninput="edit('+j+','+k+',\'kg\',this.value)"><input type="number" min="0" step="1" placeholder="reps" value="'+esc(s.reps)+'" oninput="edit('+j+','+k+',\'reps\',this.value)"><button onclick="removeSet('+j+','+k+')">−</button></div>').join('')+'<button onclick="addSet('+j+')">+ Serie</button></div>').join('')+'<button onclick="addEx()">+ Añadir ejercicio</button><p><button class="primary" onclick="finish()">Guardar entrenamiento</button></p><div class="card"><h3>Historial de '+esc(d.name)+'</h3>'+state.history.filter(h=>h.day===day).slice().reverse().slice(0,12).map(h=>'<p><b>'+esc(h.date)+'</b><br>'+h.exercises.map(e=>esc(e.name)+': '+e.sets.map(s=>s.kg+'kg × '+s.reps).join(', ')).join('<br>')+'</p>').join('')+'</div>'}function edit(j,k,f,v){state.days[day].exercises[j].sets[k][f]=v;save()}function addSet(j){state.days[day].exercises[j].sets.push({kg:"",reps:""});save();render()}function removeSet(j,k){state.days[day].exercises[j].sets.splice(k,1);save();render()}function addEx(){let name=prompt("Nombre del ejercicio");if(!name?.trim())return;state.days[day].exercises.push({id:id(),name:name.trim(),sets:[{kg:"",reps:""},{kg:"",reps:""},{kg:"",reps:""}]});save();render()}function rename(j){let ex=state.days[day].exercises[j],name=prompt("Nuevo nombre",ex.name);if(name?.trim()){ex.name=name.trim();save();render()}}function removeEx(j){if(confirm("¿Eliminar ejercicio? El historial se conservará.")){state.days[day].exercises.splice(j,1);save();render()}}function finish(){let d=state.days[day],exercises=d.exercises.map(e=>({id:e.id,name:e.name,sets:e.sets.filter(s=>s.kg!==""&&s.reps!=="").map(s=>({...s}))})).filter(e=>e.sets.length);if(!exercises.length)return alert("Introduce alguna serie completa.");if(!confirm("¿Guardar este entrenamiento?"))return;state.history.push({date:new Date().toLocaleDateString("es-ES"),day,exercises});save();render();alert("Entrenamiento guardado")}function exportData(){let a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));a.href=u;a.download="mis-marcas-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function importData(el){let file=el.files[0];if(!file)return;try{let d=JSON.parse(await file.text());if(!Array.isArray(d.days)||!Array.isArray(d.history)||d.days.length!==4)throw Error("Formato no compatible");if(confirm("Esto sustituirá tus datos actuales. ¿Continuar?")){state=d;save();render()}}catch(e){alert("No se puede importar: "+e.message)}el.value=""}save();render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
